---
user: mj
domain: home.lab
locale: lt_LT.UTF-8
dns:
  - 192.168.1.40
home_dir: "/home/{{ user }}"
git_dir: "{{ home_dir }}/github"
dotfiles_dir: "{{ git_dir }}/fedora_desktop_sysprep/dotfiles"
sddm_theme: sddm-astronaut-theme

allow_sudo:
  - /bin/kill
  - /usr/bin/dnf
  - /usr/bin/ps
  - /usr/bin/systemctl
  - /usr/bin/mount
  - /usr/bin/sshfs
  - /usr/bin/docker

font_dirs:
  - "{{ git_dir }}/sddm-astronaut-theme/Fonts"
  - "{{ git_dir }}/p10k-media"

dotfiles:
  - vimrc
  - p10k.zsh
  - alias.zsh
  - zshrc
  - zshenv
  - alacritty.toml
  - gtkrc-2.0
  - gtk-3.0
  - gtk-4.0
  - hypr
  - qt6ct
  - sidepad
  # - swaync
  # - waybar
  # - waypaper
  # - wlogout
  - xsettingsd
  - fastfetch

dotfile_symlinks:
  - vimrc
  - p10k.zsh
  - alias.zsh
  - zshrc
  - zshenv
  - alacritty.toml
  - gtkrc-2.0

services:
  - name: docker
    state: started
    enabled: true
  - name: systemd-networkd
    state: stopped
    enabled: false
  - name: dnsmasq
    state: started
    enabled: true
  - name: sshd
    state: started
    enabled: true

rpm_repositories:
  - name: docker-ce-stable
    desc: Docker CE Stable - $basearch
    url: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
    gpgkey: https://download.docker.com/linux/fedora/gpg
  - name: insync
    desc: insync repo
    url: http://yum.insync.io/fedora/$releasever/
    gpgkey: https://d2t3ff60b2tol4.cloudfront.net/repomd.xml.key
  - name: copr.lionheartp.Hyprland
    desc: Copr repo for Hyprland owned by lionheartp
    url: https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-$releasever-$basearch/
    gpgkey: https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/pubkey.gpg
  - name: rpmfusion-free
    desc: RPM Fusion for Fedora $releasever - Free
    url: http://download1.rpmfusion.org/free/fedora/releases/$releasever/Everything/$basearch/os/
    gpgkey: https://download1.rpmfusion.org/free/fedora/RPM-GPG-KEY-rpmfusion-free-fedora-2020
  - name: rpmfusion-free-updates
    desc: RPM Fusion for Fedora $releasever - Free - Updates
    url: http://download1.rpmfusion.org/free/fedora/updates/$releasever/$basearch/
    gpgkey: https://download1.rpmfusion.org/free/fedora/RPM-GPG-KEY-rpmfusion-free-fedora-2020

flatpak_repositories:
  - name: flathub
    url: "https://dl.flathub.org/repo/flathub.flatpakrepo"

python_packages:
  - screeninfo
  - ansible

binaries:
  - name: minikube
    url: https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-amd64
  - name: kubectl
    url: https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl

rpms:
  # Development tools
  - python3-pip
  - python3-devel
  - python3-autopep8
  - python3-toml
  - python3-pyyaml
  - python3-wheel
  - python3-gobject
  - python3-ansible-lint
  - qt6ct
  - qt5-qtwayland
  - qt6-qtwayland
  - qt6-qtsvg
  - qt6-qtmultimedia
  - gcc
  - jq
  - yamllint
  - ansible
  - ansible-core
  - ansible-collection-community-docker
  - docker-ce
  - docker-compose-plugin
  # Networking
  - openssl
  - nm-connection-editor
  - NetworkManager-tui
  - net-tools
  - telnet
  - iperf
  # System tools
  - zsh
  - crontabs
  - moreutils
  - lm_sensors
  - nfs-utils
  - openssh-askpass
  - fuse
  - fuse-sshfs
  - cups
  - flatpak
  - sddm
  - ImageMagick
  - inotify-tools
  - pavucontrol
  - gvfs
  - fastfetch
  - remove-retired-packages
  - blueman
  # Libraries
  - lame-libs
  - libgda
  - libgda-sqlite
  - libnotify
  - ffmpeg-libs
  # Wayland + Hyprland + noctalia
  - hyprland
  - hyprpicker
  - noctalia-git
  - xdg-user-dirs
  - xdg-desktop-portal-gtk
  - xdg-desktop-portal-hyprland
  - brightnessctl
  - tumbler
  - slurp
  - uwsm
  - papirus-icon-theme
  - papirus-icon-theme-dark
  - dejavu-fonts-all
  - fontawesome-fonts
  - google-noto-emoji-fonts
  - google-noto-sans-cjk-fonts # Terminal tools
  - vim
  - vim-ansible
  - vim-powerline
  - powerline
  - powerline-fonts
  - less-color
  - snapper # BTRFS snapshots
  - lsd # LSDeluxe, a modern replacement for 'ls'
  - bat # Better cat
  - htop
  - radeontop
  - zoxide # Fast directory jumper
  - git
  - git-lfs
  - fzf # Fuzzy finder
  - rsync
  - unzip
  - wget
  - curl
  # GUI apps
  - virt-manager
  - insync # Google Drive client
  - rpi-imager
  - cpu-x
  - alacritty
  - vlc
  - gnome-calculator
  - gnome-software
  - gnome-text-editor
  - gnome-font-viewer
  - btrfs-assistant
  - nautilus # File manager
  - evince # Document viewer
  - baobab # Disk Usage Analyzer
  - snapshot # Camera viewer
  - imv # simple image viewer
  - nwg-look # GTK settings

