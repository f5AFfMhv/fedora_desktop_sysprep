config_version = 13

[bar.default]
capsule_group = []
center = [ "clock", "control-center", "weather", "privacy", "status", "widget" ]
end = [ "status_2", "keyboard_layout", "battery", "volume", "tray", "settings", "session" ]
font_family = "FiraCode Nerd Font"
margin_ends = 5
padding = 15
scale = 1.1000000089406967
start = [ "keybinds", "workspaces", "spacer_2", "media" ]
thickness = 38
widget_spacing = 12

[battery.device."/org/freedesktop/UPower/devices/battery_hid_dco2co26o37o48o0a_battery_3"]
warning_threshold = 15

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 15

[battery.device."/org/freedesktop/UPower/devices/keyboard_dev_D7_54_3A_79_4E_D4"]
warning_threshold = 15

[calendar]
enabled = true

    [calendar.account.jankunasmartynas]
    name = "jankunasmartynas"
    type = "google"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "mic_mute"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 672.0
    box_width = 704.0
    cx = 1280.0
    cy = 720.0
    output = "DP-9"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false

[dock]
auto_hide = true
enabled = true
launcher_position = "start"
reserve_space = false
show_instance_count = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
address = "Ukmerge"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
