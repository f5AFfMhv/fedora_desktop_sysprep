[nightlight]
enabled = true

[osd]
offset_x = 0
offset_y = 20
position = "bottom_center"
position_vertical = "bottom_center"

    [osd.kinds]
    media = false

[plugin_settings."kenn/keybind-cheatsheet"]
cheatsheet_open_near_click = false
cheatsheet_placement = "attached"
columns = 2
compositor = "hyprland"
hyprland_lua_config = "/home/mj/.config/hypr/hyprland.lua"
hyprland_parser = "lua"

[plugin_settings."tordex/system-updater"]
enable_cargo = false

[plugins]
enabled = [ "tordex/system-updater", "kenn/keybind-cheatsheet" ]

[shell]
app_icon_color = "primary"
external_ip_enabled = true
font_family = "Noto Sans"
polkit_agent = true
ui_scale = 1.1000000089406967

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "/home/mj/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    direction = "right"

[theme]
builtin = "Dracula"
community_palette = "Atuel"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "zen-browser", "obsidian", "vscode", "fastfetch", "hyprtoolkit", "bat" ]

[wallpaper]
directory = "/home/mj/Pictures/Images/wallpapers"
transition = [ "fade" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/mj/Pictures/Images/wallpapers/adwaita-l.jpg"

    [wallpaper.last]
    path = "/home/mj/Pictures/Images/wallpapers/adwaita-l.jpg"

    [wallpaper.monitors.DP-9]
    path = "/home/mj/Pictures/Images/wallpapers/adwaita-l.jpg"

[widget.Updates]
type = "custom_button"

[widget.battery]
device = "/org/freedesktop/UPower/devices/battery_hidpp_battery_0"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
enabled = true
tooltip_format = "%A, %x"

[widget.custom_button_2]
type = "custom_button"

[widget.keybinds]
glyph = "keyboard-show"
type = "kenn/keybind-cheatsheet:keybinds"

[widget.lock_keys]
hide_when_off = true
show_num_lock = false

[widget.media]
hide_album_art = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.spacer_2]
interactive = false
length = 250
type = "spacer"

[widget.status]
color = "primary"
icon_color = "primary"
show_entity_count = true
type = "pozzoo/hassio:status"

[widget.status_2]
type = "tordex/system-updater:status"

[widget.sysmon]
show_value = true
visualization = "none"

[widget.tray]
drawer = true
drawer_item_size = 32.0
match_adjacent_spacing = true

[widget.volume.actions]
scroll_down = "volume-down 1%"
scroll_up = "volume-up 1%"

[widget.weather]
show_condition = false

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
show_labels = false