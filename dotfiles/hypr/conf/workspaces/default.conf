# -----------------------------------------------------
# General workspace rules
# name: "Default"
# -----------------------------------------------------

# Assigning workspace to a certain monitor. Below are just examples
# workspace = 1, monitor:eDP-1
# workspace = 2, monitor:eDP-1
# workspace = 3, monitor:eDP-1
# workspace = 4, monitor:eDP-1
# workspace = 5, monitor:DP-2
# workspace = 6, monitor:DP-2
# workspace = 7, monitor:DP-2
# workspace = 8, monitor:DP-2

# Example rules (from https://wiki.hyprland.org/Configuring/Workspace-Rules/)
# workspace = 3, rounding:false, decorate:false
# workspace = name:coding, rounding:false, decorate:false, gapsin:0, gapsout:0, border:false, decorate:false, monitor:DP-1
# workspace = 8,bordersize:8
# workspace = name:Hello, monitor:DP-1, default:true
# workspace = name:gaming, monitor:desc:Chimei Innolux Corporation 0x150C, default:true
# workspace = 5, on-created-empty:[float] firefox
# workspace = special:scratchpad, on-created-empty:foot

# Scratchpads
# Thunderbird
exec-once = flatpak run org.mozilla.Thunderbird
workspace = special:thunderbird, on-created-empty: true
windowrulev2 = workspace special:thunderbird, class:org.mozilla.Thunderbird
windowrule = float, class:org.mozilla.Thunderbird
windowrule = size 1500 850, class:org.mozilla.Thunderbird
# Mission Center
exec-once = flatpak run io.missioncenter.MissionCenter
workspace = special:missioncenter, on-created-empty: true
windowrulev2 = workspace special:missioncenter, class:io.missioncenter.MissionCenter
windowrule = float, class:io.missioncenter.MissionCenter
windowrule = size 1500 850, class:io.missioncenter.MissionCenter
# Lollypop
exec-once = lollypop
workspace = special:lollypop, on-created-empty: true
windowrulev2 = workspace special:lollypop, class:org.gnome.Lollypop
windowrule = float, class:org.gnome.Lollypop
windowrule = size 1500 850, class:org.gnome.Lollypop
# Memos
exec-once = flatpak run io.github.ungoogled_software.ungoogled_chromium --app=https://memos.home.lab
workspace = special:memos, on-created-empty: true
windowrulev2 = workspace special:memos, class:chrome-memos.home.lab__-Default
windowrule = float, class:chrome-memos.home.lab__-Default
windowrule = size 1500 850, class:chrome-memos.home.lab__-Default