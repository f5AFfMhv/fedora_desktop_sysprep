# -----------------------------------------------------
# General workspace rules
# name: "Default"
# -----------------------------------------------------

# Assigning workspace to a certain monitor. Below are just examples
# workspace = 1, monitor:eDP-1
# workspace = 2, monitor:eDP-1
# workspace = 3, monitor:eDP-1
# workspace = 4, monitor:eDP-1
# workspace = 5, monitor:DP-2
# workspace = 6, monitor:DP-2
# workspace = 7, monitor:DP-2
# workspace = 8, monitor:DP-2

# Example rules (from https://wiki.hyprland.org/Configuring/Workspace-Rules/)
# workspace = 3, rounding:false, decorate:false
# workspace = name:coding, rounding:false, decorate:false, gapsin:0, gapsout:0, border:false, decorate:false, monitor:DP-1
# workspace = 8,bordersize:8
# workspace = name:Hello, monitor:DP-1, default:true
# workspace = name:gaming, monitor:desc:Chimei Innolux Corporation 0x150C, default:true
# workspace = 5, on-created-empty:[float] firefox
# workspace = special:scratchpad, on-created-empty:foot

# Scratchpads
# Thunderbird
workspace = special:thunderbird, on-created-empty: flatpak run org.mozilla.thunderbird_esr
windowrule = match:workspace special:thunderbird, match:class org.mozilla.thunderbird_esr
windowrule = float on , match:class org.mozilla.thunderbird_esr
windowrule = size 1500 850, match:class org.mozilla.thunderbird_esr

# Mission Center
workspace = special:missioncenter, on-created-empty: flatpak run io.missioncenter.MissionCenter
windowrule = match:workspace special:missioncenter, match:class io.missioncenter.MissionCenter
windowrule = float on, match:class io.missioncenter.MissionCenter
windowrule = size 1500 850, match:class io.missioncenter.MissionCenter

# # Lollypop
# workspace = special:lollypop, on-created-empty: lollypop
# windowrule = match:workspace special:lollypop, match:class org.gnome.Lollypop
# windowrule = float on, match:class org.gnome.Lollypop
# windowrule = size 1500 850, match:class org.gnome.Lollypop

# Elisa - music player
workspace = special:elisa, on-created-empty: flatpak run org.kde.elisa
windowrule = match:workspace special:elisa, match:class org.kde.elisa
windowrule = float on, match:class org.kde.elisa
windowrule = size 1500 850, match:class org.kde.elisa

# Memos
workspace = special:memos, on-created-empty: flatpak run io.github.ungoogled_software.ungoogled_chromium --app=https://memos.home.lab
windowrule = match:workspace special:memos, match:class chrome-memos.home.lab__-Default
windowrule = float on, match:class chrome-memos.home.lab__-Default
windowrule = size 1500 850, match:class chrome-memos.home.lab__-Default

# Terminal1
workspace = special:terminal1, on-created-empty: alacritty --class dotfiles-floating

# Terminal2
workspace = special:terminal2, on-created-empty: alacritty --class dotfiles-floating

# Terminal3
workspace = special:terminal3, on-created-empty: alacritty --class dotfiles-floating

# Updates
workspace = special:updates, on-created-empty: alacritty --class dotfiles-floating -e ~/.config/ml4w/scripts/installupdates.sh

# Noctalia persistent workspaces
workspace = 1, monitor:DP-9, persistent:true
workspace = 2, monitor:DP-9, persistent:true
workspace = 3, monitor:DP-9, persistent:true
workspace = 4, monitor:DP-9, persistent:true
