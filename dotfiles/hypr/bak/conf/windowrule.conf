# -----------------------------------------------------
# Window rules
# -----------------------------------------------------

windowrule = tile on, match:title ^(Microsoft-edge)$
windowrule = tile on, match:title ^(Brave-browser)$
windowrule = tile on, match:title ^(Chromium)$
windowrule = float on, match:title ^(pavucontrol)$
windowrule = float on, match:title ^(blueman-manager)$
windowrule = float on, match:title ^(nm-connection-editor)$
windowrule = float on, match:title ^(qalculate-gtk)$

# Gnome Calendar
windowrule = float on, match:title ^(Calendar)$
windowrule = move 1220 295, match:title ^(Calendar)$
windowrule = size 100 100, match:title ^(Calendar)$
windowrule = pin on, match:title ^(Calendar)$
# windowrule = no_border on, match:title ^(Calendar)$
windowrule = no_blur on, match:title ^(Calendar)$

# Gnome Calculator
windowrule = float on, match:title ^(Calculator)$
windowrule = move 2315 1070, match:title ^(Calculator)$
windowrule = size 100 100, match:title ^(Calculator)$
windowrule = pin on, match:title ^(Calculator)$

# Browser Picture in Picture
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = size 640 360, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = move 74% 74%, match:title ^(Picture-in-Picture)$

# Pavucontrol floating
windowrule = float on,match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = size 700 600,match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = center on,match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = pin on,match:class (.*org.pulseaudio.pavucontrol.*)

# Blueman Manager
windowrule = float on,match:class (blueman-manager)
windowrule = size 800 600,match:class (blueman-manager)
windowrule = center on,match:class (blueman-manager)

# nwg-look
windowrule = float on,match:class (nwg-look)
windowrule = size 700 600,match:class (nwg-look)
windowrule = move 10% 20%,match:class (nwg-look)
windowrule = pin on,match:class (nwg-look)

# Hyprland Share Picker
windowrule = float on, match:class (hyprland-share-picker)
windowrule = pin on, match:class (hyprland-share-picker)
windowrule = center on, match:title match:class (hyprland-share-picker)
windowrule = size 600 400,match:class (hyprland-share-picker)

# General floating
windowrule = float on,match:class (dotfiles-floating)
windowrule = size 1500 850,match:class (dotfiles-floating)
windowrule = center on,match:class (dotfiles-floating)

# Chrome GPT
windowrule = float off,match:class (chrome-chatgpt.com__-Default)
windowrule = size 1250 700,match:class (chrome-chatgpt.com__-Default)
windowrule = center off,match:class (chrome-chatgpt.com__-Default)
windowrule = pin off,match:class (chrome-chatgpt.com__-Default)

# float on and center file pickers
windowrule = float on, match:class xdg-desktop-portal-gtk, match:title ^(Open.*Files?|Save.*Files?|All Files|Save)
windowrule = center on, match:class xdg-desktop-portal-gtk, match:title ^(Open.*Files?|Save.*Files?|All Files|Save)

# idleinhibit
windowrule = idle_inhibit fullscreen, match:class ([window]) # Available modes: none, always, focus, fullscreen

#xwayland related rules
# when moving objects in resolve a large border is produced 
# This rule prevents that and serves as a template for any problematic xwayland apps
windowrule = no_blur on, match:class ^(\bresolve\b)$, match:xwayland 1
# This is a general rule for xwayland apps but can have other consequences 
# for one user it impacted EMACs so it's disabled by default 
# It's here as a reference or for quick triage of xwayland ap
#windowrule = no_blur, xwayland:1

